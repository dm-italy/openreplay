apiVersion: v1
kind: Pod
metadata:
  name: data-migrator
  namespace: openreplay
spec:
  containers:
    - name: migrator
      image: alpine:3.19
      command: ["sleep", "7200"]
      volumeMounts:
        # MinIO
        - name: minio-old
          mountPath: /old/minio
        - name: minio-new
          mountPath: /new/minio
        # Redis
        - name: redis-old
          mountPath: /old/redis
        - name: redis-new
          mountPath: /new/redis
        # Shared storage
        - name: shared-old
          mountPath: /old/shared
        - name: shared-new
          mountPath: /new/shared
  volumes:
    # --- Vecchi PVC (Longhorn) ---
    - name: minio-old
      persistentVolumeClaim:
        claimName: minio
    - name: redis-old
      persistentVolumeClaim:
        claimName: redis-data-redis-master-0
    - name: shared-old
      persistentVolumeClaim:
        claimName: openreplay-shared-storage
    # --- Nuovi PVC (CephFS) ---
    - name: minio-new
      persistentVolumeClaim:
        claimName: minio-ceph
    - name: redis-new
      persistentVolumeClaim:
        claimName: redis-data-ceph
    - name: shared-new
      persistentVolumeClaim:
        claimName: shared-storage-ceph
  restartPolicy: Never
