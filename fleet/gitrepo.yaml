# Applica su Rancher:
#   kubectl apply -f gitrepo.yaml -n fleet-default
#
# Oppure crea dall'UI: Continuous Delivery > Git Repos > Add Repository
#
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: openreplay
  namespace: fleet-default
spec:
  # CAMBIA con il tuo repo git
  repo: https://github.com/TUO-ORG/openreplay.git
  branch: main
  # Se repo privato:
  # clientSecretName: git-credentials
  paths:
    - fleet/01-databases
    - fleet/02-openreplay
  targets:
    - clusterSelector: {}
